name: release-pack

# Builds one component pack and publishes it as a GitHub Release.
#
# Engine packs are compiled from the source pinned in packs.json:
#   - clang 20 (the GNU driver, targeting MSVC) with GGML_OPENMP_FETCH so
#     ggml-cpu-*.dll link LLVM's libomp
#   - GGML_BACKEND_DL + GGML_CPU_ALL_VARIANTS so one pack serves every x86 CPU
#   - the PrismML fork so the shipped ternary/MTP GGUFs (ggml type 142) load
#   - the same flags reproduce the 0.1.0 archives (see README "Engine build")
#
# clang-cl is not usable here: CMake treats it as MSVC, so it drops the five
# non-MSVC CPU variants and never passes -mavxvnni, which makes the alderlake
# build fail on _mm256_dpbusd_avx_epi32.
#
# espeak-ng is unpacked from the official MSI. stt-phonon2 is still built by
# hand and uploaded through `source_url`.
#
# Run with dry_run to build, package, and smoke-test without publishing.

on:
  workflow_dispatch:
    inputs:
      pack:
        description: Pack id
        required: true
        type: choice
        options:
          - engine-vulkan
          - engine-cpu
          - espeak-ng
          - stt-phonon2
      version:
        description: Version (blank uses the version in packs.json)
        required: false
        type: string
      source_url:
        description: "stt-phonon2 only: HTTPS URL to the prebuilt pack zip"
        required: false
        type: string
      dry_run:
        description: Build and smoke-test without publishing or committing
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PACK: ${{ inputs.pack }}
      VERSION: ${{ inputs.version }}
      SOURCE_URL: ${{ inputs.source_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tooling
        shell: pwsh
        run: python -m py_compile scripts/packs.py

      - name: Resolve the build plan
        id: plan
        shell: pwsh
        run: |
          $plan = python scripts/packs.py plan --pack $env:PACK | Out-String | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "packs.py plan failed" }
          if ($plan.build.type -eq 'disabled') {
            throw "$env:PACK is disabled: $($plan.build.reason)"
          }
          $version = if ($env:VERSION) { $env:VERSION } else { $plan.version }
          if (-not $version) { throw "$env:PACK has no version" }
          "kind=$($plan.kind)"           >> $env:GITHUB_OUTPUT
          "type=$($plan.build.type)"     >> $env:GITHUB_OUTPUT
          "repo=$($plan.build.repo)"     >> $env:GITHUB_OUTPUT
          "ref=$($plan.build.ref)"       >> $env:GITHUB_OUTPUT
          "backend=$($plan.build.backend)" >> $env:GITHUB_OUTPUT
          "url=$($plan.build.url)"       >> $env:GITHUB_OUTPUT
          "sha256=$($plan.build.sha256)" >> $env:GITHUB_OUTPUT
          "version=$version"             >> $env:GITHUB_OUTPUT

      # --- engine packs -------------------------------------------------------

      - name: Install LLVM 20 (clang)
        if: steps.plan.outputs.type == 'llama.cpp'
        shell: pwsh
        run: |
          # GGML_OPENMP_FETCH pins the OpenMP runtime to 20.1.8 and refuses any
          # other compiler major version.
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/LLVM-20.1.8-win64.exe"
          $exe = "$env:RUNNER_TEMP\LLVM-20.1.8-win64.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "3197846a2b19063687dd56e93e34cd941e3548d907f23a6131571321bdf9fe7b") {
            throw "LLVM installer hash mismatch: $hash"
          }
          Start-Process -FilePath $exe -ArgumentList "/S", "/D=C:\LLVM" -Wait
          if (-not (Test-Path "C:\LLVM\bin\clang.exe")) { throw "clang was not installed" }
          if (-not (Test-Path "C:\LLVM\bin\clang++.exe")) { throw "clang++ was not installed" }
          "C:\LLVM\bin" >> $env:GITHUB_PATH
          "C:\Program Files\7-Zip" >> $env:GITHUB_PATH

      - name: Set up the MSVC environment
        if: steps.plan.outputs.type == 'llama.cpp'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install the Vulkan SDK
        if: steps.plan.outputs.type == 'llama.cpp' && steps.plan.outputs.backend == 'vulkan'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true

      - name: Check out the engine source
        if: steps.plan.outputs.type == 'llama.cpp'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.plan.outputs.repo }}
          ref: ${{ steps.plan.outputs.ref }}
          path: llama.cpp
          fetch-depth: 1

      - name: Configure the engine
        if: steps.plan.outputs.type == 'llama.cpp'
        shell: pwsh
        run: |
          $vulkan = if ("${{ steps.plan.outputs.backend }}" -eq "vulkan") { "ON" } else { "OFF" }
          cmake -S llama.cpp -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DBUILD_SHARED_LIBS=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_RPC=ON `
            -DGGML_OPENMP=ON `
            -DGGML_OPENMP_FETCH=ON `
            -DGGML_CCACHE=OFF `
            "-DGGML_VULKAN=$vulkan" `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_UI=OFF `
            -DLLAMA_USE_PREBUILT_UI=OFF
          # LLAMA_CONNECT stays OFF: it downloads a prebuilt third-party binary
          # at build time, changes under "latest", and Aether never runs it.
          # The UI is off too: Aether has its own frontend, and the prebuilt UI
          # target would fetch assets from Hugging Face during the build.
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }

      - name: Build the engine
        if: steps.plan.outputs.type == 'llama.cpp'
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }

      - name: Stage the engine payload
        if: steps.plan.outputs.type == 'llama.cpp'
        shell: pwsh
        run: |
          $dest = "packs/$($env:PACK)/bin"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Get-ChildItem build/bin -File |
            Where-Object { $_.Extension -in '.exe', '.dll' -or $_.Name -like 'LICENSE-*' } |
            Copy-Item -Destination $dest
          Copy-Item assets/engines/LICENSE-llama.cpp.txt "packs/$($env:PACK)/LICENSE-llama.cpp.txt"
          foreach ($file in 'llama-server.exe', 'llama-cli.exe', 'ggml.dll', 'llama-common.dll') {
            if (-not (Test-Path "$dest/$file")) { throw "build output is missing $file" }
          }
          Write-Output "$((Get-ChildItem $dest -File).Count) files staged in bin/"

      # --- espeak-ng ----------------------------------------------------------

      - name: Unpack espeak-ng from the official MSI
        if: steps.plan.outputs.type == 'msi'
        shell: pwsh
        run: |
          $msi = "$env:RUNNER_TEMP\espeak-ng.msi"
          Invoke-WebRequest -Uri "${{ steps.plan.outputs.url }}" -OutFile $msi
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "${{ steps.plan.outputs.sha256 }}") {
            throw "espeak-ng.msi hash mismatch: $hash"
          }
          # An administrative install writes the payload in one wrapper folder
          # plus a copy of the MSI at the root. Stage the wrapper's contents so
          # the archive has no extra top-level directory (packs.py would also
          # flatten a single one, but the MSI copy is not a payload).
          $stage = "$env:RUNNER_TEMP\espeak-stage"
          Start-Process msiexec -ArgumentList "/a", "`"$msi`"", "/qn", "TARGETDIR=`"$stage`"" -Wait
          $folders = @(Get-ChildItem $stage -Directory)
          if ($folders.Count -ne 1) {
            throw "unexpected MSI layout: $((Get-ChildItem $stage).Name -join ', ')"
          }
          $dest = "packs/$($env:PACK)"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Get-ChildItem $folders[0].FullName | Copy-Item -Destination $dest -Recurse -Force
          if (Get-ChildItem $dest -Recurse -File -Filter *.msi) { throw "the MSI leaked into the payload" }
          Copy-Item assets/espeak-ng/LICENSE-GPL-3.0.txt "$dest/LICENSE-GPL-3.0.txt"
          $offer = Get-Content assets/espeak-ng/SOURCE_OFFER.template.txt -Raw
          $offer = $offer.Replace('{{version}}', "${{ steps.plan.outputs.version }}")
          $offer = $offer.Replace('{{date}}', (Get-Date -Format 'yyyy-MM-dd'))
          [System.IO.File]::WriteAllText((Join-Path $PWD "$dest/SOURCE_OFFER.txt"), $offer)
          Write-Output "$((Get-ChildItem $dest -Recurse -File).Count) files staged"

      # --- stt-phonon2 (manual build) ----------------------------------------

      - name: Fetch the prebuilt STT payload
        if: steps.plan.outputs.type == 'manual'
        shell: pwsh
        run: |
          if (-not $env:SOURCE_URL) { throw "source_url is required for $env:PACK" }
          python scripts/packs.py fetch --pack $env:PACK --url $env:SOURCE_URL
          if ($LASTEXITCODE -ne 0) { throw "fetch failed" }

      # --- package ------------------------------------------------------------

      - name: Package and update the catalog
        id: package
        shell: pwsh
        run: |
          if ($env:VERSION) {
            python scripts/packs.py package --pack $env:PACK --version $env:VERSION
          } else {
            python scripts/packs.py package --pack $env:PACK
          }
          if ($LASTEXITCODE -ne 0) { throw "packaging failed" }
          $release = Get-Content dist/release.json -Raw | ConvertFrom-Json
          "tag=$($release.tag)"     >> $env:GITHUB_OUTPUT
          "asset=$($release.asset)" >> $env:GITHUB_OUTPUT
          "sha256=$($release.sha256)" >> $env:GITHUB_OUTPUT

      - name: Smoke-test the payload
        if: steps.plan.outputs.type != 'manual'
        shell: pwsh
        run: |
          $pack = "packs/$($env:PACK)"
          if ("${{ steps.plan.outputs.kind }}" -eq "engine") {
            & "$pack/bin/llama-cli.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "llama-cli did not start" }
            & "$pack/bin/llama-server.exe" --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "llama-server did not start" }
            # The fork is what understands the ternary PQ2_0 type (ggml 142)
            # used by the shipped Ternary-Bonsai model. An upstream build starts
            # fine but cannot load it, so check the type table is present.
            if ("${{ steps.plan.outputs.repo }}" -match 'PrismML') {
              $text = [System.Text.Encoding]::ASCII.GetString(
                [System.IO.File]::ReadAllBytes("$pack/bin/ggml-base.dll"))
              if (-not $text.Contains("PQ2_0")) {
                throw "ggml-base.dll has no PQ2_0 type: this engine cannot load the shipped model"
              }
            }
          } else {
            # espeak-ng resolves espeak-ng-data relative to its install root,
            # not the executable, so a relocated copy must be told where the
            # data is. The backend always passes --path for this reason, and
            # --version alone crashes without it.
            $ipa = & "$pack/espeak-ng.exe" -q --ipa --path "$pack/espeak-ng-data" "hello"
            if (-not $ipa) { throw "espeak-ng returned no phonemes" }
            Write-Output "espeak-ng said: $ipa"
          }

      - name: Upload the pack for review
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: |
            dist/${{ steps.package.outputs.asset }}
            dist/${{ steps.package.outputs.asset }}.sha256
          retention-days: 7

      # --- publish ------------------------------------------------------------

      - name: Refuse to reuse a tag
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          # git exits 0 whether or not the ref exists and says nothing on
          # stderr. `gh release view` returns 1 for "not found", and in
          # PowerShell 7 that stderr write becomes an error record that fails
          # the step even though the release is missing.
          $tag = "${{ steps.package.outputs.tag }}"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "could not query tags" }
          if ($existing) {
            throw "$tag already exists. Bump the version; never replace published bytes."
          }

      - name: Create the release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = switch ("${{ steps.plan.outputs.type }}") {
            'llama.cpp' { "llama.cpp ${{ steps.plan.outputs.repo }}@${{ steps.plan.outputs.ref }} (${{ steps.plan.outputs.backend }})" }
            'msi'       { "${{ steps.plan.outputs.url }}" }
            default     { "$env:SOURCE_URL" }
          }
          $notes = @"
          Aether component pack: ${{ steps.package.outputs.tag }}

          Source: $source
          SHA-256: ``${{ steps.package.outputs.sha256 }}``

          Licence terms: https://github.com/Arthur-101/aether-packs/blob/main/PACK_LICENSES.md
          "@
          gh release create "${{ steps.package.outputs.tag }}" `
            "dist/${{ steps.package.outputs.asset }}" `
            "dist/${{ steps.package.outputs.asset }}.sha256" `
            --title "${{ steps.package.outputs.tag }}" `
            --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "release creation failed" }

      - name: Commit the updated catalog
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs.json checksums.json components_manifest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "packs: publish ${{ steps.package.outputs.tag }} [skip ci]"
            git push
            if ($LASTEXITCODE -ne 0) { throw "git push failed" }
          } elseif ($LASTEXITCODE -eq 0) {
            Write-Output "Catalog unchanged."
          } else {
            throw "git diff failed"
          }